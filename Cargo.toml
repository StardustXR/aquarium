[package]
name = "aquarium"
version = "0.52.0"
edition = "2024"

[dependencies]
glam = { version = "0.33.7", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "*", features = ["rt", "tokio-macros", "sync"] }
stardust-xr-fusion = "0.52.0"
stardust-xr-molecules = "0.52.0"
stardust-xr-asteroids = "0.52.0"
clap = { version = "4.6.6", features = ["derive"] }
ron = "0.12.2"
